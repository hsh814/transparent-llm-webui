<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">transparent-llm-webui favicon</title>
  <desc id="desc">A transparent web window containing a connected language model symbol.</desc>
  <defs>
    <linearGradient id="accent" x1="16" y1="12" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Browser frame -->
  <rect x="7" y="9" width="50" height="46" rx="9" fill="#0F172A" stroke="url(#accent)" stroke-width="3"/>
  <path d="M8.5 22H55.5" stroke="#64748B" stroke-width="2"/>
  <circle cx="15" cy="15.5" r="2" fill="#38BDF8"/>
  <circle cx="22" cy="15.5" r="2" fill="#A78BFA"/>
  <circle cx="29" cy="15.5" r="2" fill="#94A3B8"/>

  <!-- Transparent / inspectable layers -->
  <path d="M14 28H50" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <path d="M14 47H50" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

  <!-- LLM network -->
  <g fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 39L31 31L42 36L35 45Z"/>
    <path d="M31 31L35 45" opacity=".85"/>
    <path d="M22 39L42 36" opacity=".65"/>
  </g>
  <g fill="#E0F2FE" stroke="url(#accent)" stroke-width="2">
    <circle cx="22" cy="39" r="4"/>
    <circle cx="31" cy="31" r="4"/>
    <circle cx="42" cy="36" r="4"/>
    <circle cx="35" cy="45" r="4"/>
  </g>
</svg>

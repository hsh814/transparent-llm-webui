<form class="model-selector" id="model-selector" hx-post="/sessions/{{ session.id }}/model" hx-target="#model-selector" hx-swap="outerHTML" hx-trigger="change">
  <label class="sr-only" for="model-choice">Model for the next message</label>
  <select id="model-choice" name="model">
    {% for m in models | sort_models(usage) %}<option value="{{ m }}" {{ 'selected' if m == session.model else '' }}>{{ m }}</option>{% endfor %}
  </select>
  <button type="button" class="btn-refresh" hx-post="/sessions/{{ session.id }}/model/refresh" hx-target="#model-selector" hx-swap="outerHTML" title="Refresh model list" aria-label="Refresh model list">↻</button>
</form>

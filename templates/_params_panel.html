<form class="params-panel" id="params-panel"
      hx-post="/sessions/{{ session.id }}/model"
      hx-target="#params-panel"
      hx-swap="outerHTML">
  <input type="hidden" name="model" value="{{ session.model }}">
  <div class="param-row">
    <label>Reasoning effort
      <select name="reasoning_effort">
        {% for level in ['none', 'low', 'medium', 'high', 'max'] %}
        <option value="{{ level }}" {{ 'selected' if params.get('reasoning_effort', 'low') == level else '' }}>{{ level }}</option>
        {% endfor %}
      </select>
    </label>
  </div>
  <div class="param-row">
    <label>Temperature <span class="param-value">{{ params.get('temperature', 0.7) }}</span>
      <input type="range" name="temperature" min="0" max="2" step="0.05"
             value="{{ params.get('temperature', 0.7) }}"
             oninput="this.previousElementSibling.textContent = this.value">
    </label>
  </div>
  <div class="param-row">
    <label>Top P <span class="param-value">{{ params.get('top_p', 0.9) }}</span>
      <input type="range" name="top_p" min="0" max="1" step="0.05"
             value="{{ params.get('top_p', 0.9) }}"
             oninput="this.previousElementSibling.textContent = this.value">
    </label>
  </div>
  <div class="param-row">
    <label>Max tokens
      <input type="number" name="max_tokens" min="1"
             value="{{ params.get('max_tokens', 1024) }}">
    </label>
  </div>
  <details class="advanced">
    <summary>Advanced</summary>
    <div class="param-row">
      <label>Seed (blank = random)
        <input type="number" name="seed" value="{{ params.get('seed', '') if params.get('seed') is not none else '' }}">
      </label>
    </div>
    <p class="muted">Context capacity: {{ ctx_cap if ctx_cap else 'managed by the model' }}. Available reasoning levels depend on the model.</p>
  </details>
</form>

<div class="session-items">
  {% for session in sessions %}
  <div class="session-item {{ 'active' if session.id == current_session_id else '' }}">
    <a href="/sessions/{{ session.id }}"
       hx-get="/sessions/{{ session.id }}"
       hx-target="#chat-surface"
       hx-swap="outerHTML"
       hx-push-url="/?session={{ session.id }}"
       aria-current="{{ 'page' if session.id == current_session_id else 'false' }}"
       aria-label="{{ session.title }}"
       title="{{ session.title }}"
       class="session-link"><span class="session-title">{{ session.title }}</span>
      <time class="session-modified" datetime="{{ session.updated_at|utc_iso }}"
            title="Last modified: {{ session.updated_at }} UTC">Updated {{ session.updated_at }} UTC</time>
    </a>
    <button class="btn-mini delete-session" aria-label="Delete {{ session.title }}"
            hx-post="/sessions/{{ session.id }}/delete"
            hx-target="#folder-list"
            hx-swap="innerHTML"
            hx-confirm="Delete this chat?">×</button>
  </div>
  {% endfor %}
</div>
{% if sessions|length > 10 %}
<button class="btn-mini show-all" type="button"
        data-count="{{ sessions|length }}">Show all ({{ sessions|length }})</button>
{% endif %}
<button class="btn-mini new-chat"
        hx-post="/folders/{{ folder.id }}/sessions"
        hx-target="#folder-list"
        hx-swap="innerHTML">+ New chat</button>

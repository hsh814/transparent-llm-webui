<details class="system-prompt" id="system-prompt-block" {{ 'open' if folder.system_prompt else '' }}>
  <summary><span class="status-dot {{ 'inactive' if not folder.system_prompt else '' }}"></span>System prompt <span class="muted">{{ 'Active' if folder.system_prompt else 'None' }}</span></summary>
  {% if folder.system_prompt %}
  <pre>{{ folder.system_prompt }}</pre>
  {% else %}
  <p class="muted">No system prompt for this folder.</p>
  {% endif %}
</details>

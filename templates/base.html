<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>{% block title %}Simple AI Chat{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/sse.js"></script>
</head>
<body hx-ext="sse">
<script>
  // Parameters fold: collapsed on phones, expanded on larger screens.
  // The template renders it open; sync to the viewport so mobile starts
  // folded and desktop keeps the full panel. Re-run after chat-surface
  // swaps, which re-create the details element.
  function syncParamsToggle() {
    var paramsToggle = document.querySelector('.params-toggle');
    if (!paramsToggle) { return; }
    var mobile = window.matchMedia('(max-width: 640px)').matches;
    if (mobile) {
      paramsToggle.removeAttribute('open');
    } else {
      paramsToggle.setAttribute('open', '');
    }
  }
  // Keep the latest message visible: scroll the message list to bottom
  // after any swap into it, and on initial load.
  document.body.addEventListener('htmx:oobAfterSwap', function (evt) {
    // OOB swaps (e.g. the chat surface returned by + New chat) fire
    // htmx:oobAfterSwap on the swapped element, not htmx:afterSwap.
    var t = evt.target;
    if (t && t.id === 'chat-surface') {
      var layout = document.querySelector('.layout');
      if (layout) { layout.classList.remove('nav-open'); }
      var btn = document.querySelector('.menu-btn');
      if (btn) { btn.setAttribute('aria-expanded', 'false'); }
      syncParamsToggle();
    }
  });
  // Preserve folder open/close state across sidebar re-renders: the server
  // re-renders #folder-list on session selection, chat creation, renames,
  // etc., and the re-render starts collapsed. Snapshot open folders before
  // the swap and re-apply after. htmx processes OOB swaps before the main
  // swap, so the restore is deferred to a microtask to run after both.
  var openFolderIds = [];
  var allFolderIds = [];
  function snapshotOpenFolders() {
    openFolderIds = Array.from(document.querySelectorAll('.folder-item.is-open'))
      .map(function (i) { return i.dataset.folderId; });
    allFolderIds = Array.from(document.querySelectorAll('.folder-item.is-all'))
      .map(function (i) { return i.dataset.folderId; });
  }
  function restoreOpenFolders(container) {
    if (!openFolderIds.length) { return; }
    openFolderIds.forEach(function (id) {
      var item = container.querySelector('.folder-item[data-folder-id="' + id + '"]');
      if (item) {
        item.classList.add('is-open');
        var toggle = item.querySelector('.folder-toggle');
        if (toggle) { toggle.setAttribute('aria-expanded', 'true'); }
        if (allFolderIds.indexOf(id) !== -1) {
          item.classList.add('is-all');
          var sa = item.querySelector('.show-all');
          if (sa) { sa.textContent = 'Show less'; }
        }
      }
    });
    openFolderIds = [];
    allFolderIds = [];
  }
  function scheduleRestore(container) {
    setTimeout(function () { restoreOpenFolders(container); }, 0);
  }
  document.body.addEventListener('htmx:beforeSwap', function (evt) {
    var t = evt.detail && evt.detail.target;
    if (t && t.id === 'folder-list') { snapshotOpenFolders(); }
  });
  document.body.addEventListener('htmx:afterSwap', function (evt) {
    var t = evt.detail && evt.detail.target;
    if (t && t.id === 'folder-list') { scheduleRestore(t); }
  });
  document.body.addEventListener('htmx:oobBeforeSwap', function (evt) {
    var t = evt.target;
    if (t && t.id === 'folder-list') { snapshotOpenFolders(); }
  });
  document.body.addEventListener('htmx:oobAfterSwap', function (evt) {
    var t = evt.target;
    if (t && t.id === 'folder-list') { scheduleRestore(t); }
  });
  document.body.addEventListener('htmx:afterSwap', function (evt) {
    var t = evt.detail && evt.detail.target;
    if (t && t.id === 'message-list') {
      t.scrollTop = t.scrollHeight;
    } else if (t && t.id === 'chat-surface') {
      // A session was selected (or created): close the mobile drawer.
      var layout = document.querySelector('.layout');
      if (layout) { layout.classList.remove('nav-open'); }
      var btn = document.querySelector('.menu-btn');
      if (btn) { btn.setAttribute('aria-expanded', 'false'); }
      syncParamsToggle();
    }
  });
  document.body.addEventListener('htmx:sseMessage', function (evt) {
    var elt = evt.target;
    var list = elt && elt.closest ? elt.closest('#message-list') : null;
    if (list) { list.scrollTop = list.scrollHeight; }
  });
  // Clear the composer after a successful send; keep the draft when the
  // request fails (network error or non-2xx) so it can be retried.
  document.body.addEventListener('htmx:afterRequest', function (evt) {
    if (evt.detail.successful && evt.target.matches('form.composer')) {
      var ta = evt.target.querySelector('textarea[name="content"]');
      if (ta) { ta.value = ''; }
    }
  });
  document.addEventListener('DOMContentLoaded', function () {
    var list = document.getElementById('message-list');
    if (list) { list.scrollTop = list.scrollHeight; }

    // Mobile drawer: hamburger toggles, scrim and Escape close.
    var layout = document.querySelector('.layout');
    var menuBtn = document.querySelector('.menu-btn');
    var scrim = document.querySelector('.scrim');
    if (layout && menuBtn) {
      menuBtn.addEventListener('click', function () {
        var open = layout.classList.toggle('nav-open');
        menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    }
    if (layout && scrim) {
      scrim.addEventListener('click', function () {
        layout.classList.remove('nav-open');
        if (menuBtn) { menuBtn.setAttribute('aria-expanded', 'false'); }
      });
    }
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && layout && layout.classList.contains('nav-open')) {
        layout.classList.remove('nav-open');
        if (menuBtn) { menuBtn.setAttribute('aria-expanded', 'false'); }
      }
    });

    // Parameters fold: sync to viewport (function defined above).
    // Copy buttons: delegated so they survive htmx swaps of #chat-surface
    // and #message-list.
    document.body.addEventListener('click', function (evt) {
      // Folder hamburger dropdown: toggle the menu, close others; clicking
      // anywhere else closes all open menus.
      var menuBtn = evt.target.closest('.folder-menu-btn');
      if (menuBtn) {
        var menu = menuBtn.parentElement.querySelector('.folder-menu');
        if (menu) {
          document.querySelectorAll('.folder-menu.open').forEach(function (m) {
            if (m !== menu) { m.classList.remove('open'); }
          });
          menu.classList.toggle('open');
        }
        return;
      }
      if (!evt.target.closest('.folder-menu-wrapper')) {
        document.querySelectorAll('.folder-menu.open').forEach(function (m) {
          m.classList.remove('open');
        });
      }
      // Copy-all button (chat header).
      var allBtn = evt.target.closest('#copy-all-btn');
      if (allBtn) {
        var msgs = document.querySelectorAll('#message-list .message .content');
        var text = Array.from(msgs).map(function (el) { return el.textContent; }).join('\n\n');
        copyText(text, allBtn);
        return;
      }
      // Per-message Copy button. The message content is carried as JSON in
      // data-copy (tojson keeps newlines as \n, so HTML attribute whitespace
      // collapse cannot lose them); parse it back to the exact string.
      var btn = evt.target.closest('.btn-copy');
      if (btn) {
        copyText(JSON.parse(btn.dataset.copy), btn);
      }
      // Folder fold: toggle name -> top-10 view, Show all -> everything.
      // Delegated on body so freshly swapped #folder-list content works.
      var toggle = evt.target.closest('.folder-toggle');
      if (toggle) {
        var item = toggle.closest('.folder-item');
        if (item) {
          var open = !item.classList.contains('is-open');
          item.classList.toggle('is-open', open);
          if (!open) {
            item.classList.remove('is-all');
            var sa = item.querySelector('.show-all');
            if (sa) { sa.textContent = 'Show all (' + sa.dataset.count + ')'; }
          }
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        }
        return;
      }
      var showAll = evt.target.closest('.show-all');
      if (showAll) {
        var item = showAll.closest('.folder-item');
        if (item) {
          var all = item.classList.toggle('is-all');
          showAll.textContent = all ? 'Show less' : ('Show all (' + showAll.dataset.count + ')');
        }
        return;
      }
    });
  });

  // Copy text to the clipboard with a graceful fallback for non-secure
  // contexts (plain HTTP / LAN IPs) where navigator.clipboard is undefined,
  // and brief visual feedback on the triggering button.
  function copyText(text, btn) {
    var done = function () {
      if (!btn) { return; }
      var orig = btn.dataset.orig || (btn.dataset.orig = btn.textContent);
      btn.textContent = 'Copied!';
      clearTimeout(btn._copyTimer);
      btn._copyTimer = setTimeout(function () { btn.textContent = orig; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallback(text, done); });
    } else {
      fallback(text, done);
    }
  }
  // Legacy fallback: hidden textarea + execCommand('copy').
  function fallback(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    done();
  }
</script>
{% block body %}{% endblock %}
</body>
</html>
